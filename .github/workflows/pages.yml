name: Build and deploy OneShot gallery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/*/package-lock.json

      - name: Build all six OneShot projects
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp index.html public/index.html
          touch public/.nojekyll

          projects=(
            school-sandbox
            nature-explorer
            cardistry-lab
            desk-wars
            zhen-huan-incremental
            zhen-huan-idle
          )

          for project in "${projects[@]}"; do
            echo "::group::Building ${project}"
            pushd "projects/${project}" >/dev/null
            npm ci
            npm run build -- --base=./
            popd >/dev/null

            mkdir -p "public/${project}"
            cp -R "projects/${project}/dist/." "public/${project}/"
            test -f "public/${project}/index.html"
            echo "::endgroup::"
          done

      - name: Verify gallery routes
        shell: bash
        run: |
          set -euo pipefail
          for route in school-sandbox nature-explorer cardistry-lab desk-wars zhen-huan-incremental zhen-huan-idle; do
            grep -q "./${route}/" public/index.html
            test -s "public/${route}/index.html"
          done
          grep -q "Fable 5.1" public/index.html

      - name: Check whether GitHub Pages is enabled
        id: pages
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="$(curl -sS -o /dev/null -w "%{http_code}"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled yet; deployment will be skipped."
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && steps.pages.outputs.enabled == 'true'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
