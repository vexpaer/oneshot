name: Build and deploy OneShot gallery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/*/package-lock.json
      - name: Build all six OneShot projects
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp index.html public/index.html
          touch public/.nojekyll

          projects=(
            school-sandbox
            nature-explorer
            cardistry-lab
            desk-wars
            zhen-huan-incremental
            zhen-huan-idle
          )

          for project in "${projects[@]}"; do
            echo "::group::Building ${project}"
            pushd "projects/${project}" >/dev/null
            npm ci
            npm run build -- --base=./
            popd >/dev/null

            mkdir -p "public/${project}"
            cp -R "projects/${project}/dist/." "public/${project}/"
            test -f "public/${project}/index.html"
            echo "::endgroup::"
          done

      - name: Verify gallery routes
        shell: bash
        run: |
          set -euo pipefail
          for route in school-sandbox nature-explorer cardistry-lab desk-wars zhen-huan-incremental zhen-huan-idle; do
            grep -q "./${route}/" public/index.html
            test -s "public/${route}/index.html"
          done
          grep -q "Fable 5.1" public/index.html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
